[project]
name = "itda-backend"
version = "0.1.0"
description = "ITDA Phase 0 API and analysis worker foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "PyYAML==6.0.2",
  "openapi-spec-validator==0.7.2",
  "jsonschema==4.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

