[project]
name = "itda-backend"
version = "0.1.0"
description = "ITDA Phase 0 API and analysis worker foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.32.0",
  "cryptography>=50.0.2",
  "fastapi==0.115.12",
  "openai>=3.51.0",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "pyjwt>=2.15.1",
  "python-dotenv>=1.2.4",
  "sqlalchemy[asyncio]>=2.1.8",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "PyYAML==6.0.2",
  "openapi-spec-validator==0.7.2",
  "jsonschema==4.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

