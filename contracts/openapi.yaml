  /v1/assets/uploads:
    post:
      tags:
      - assets
      summary: Create Asset Upload
      description: Reserve private content-assets/{authenticated_user_id}/{asset_id}/source.
        Server generates path and signed PUT/upload capability with upsert=false;
        never accept client paths or user IDs. Signed upload capability currently
        has Supabase's 2-hour lifetime; expiry is explicit. Allow JPEG/PNG/WebP/PDF/plain
        text, <=20 MiB. Do not log capability URLs. Replays return same reservation
        while live; expired reservation ->409 upload_expired, use a new key. Phase
        0 returns 501; no fake upload URL.
      operationId: createAssetUpload
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable client-generated key per logical operation; retain across
            retries.
          title: Idempotency-Key
        description: Stable client-generated key per logical operation; retain across
          retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUploadCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUpload'
        '400':
          description: Invalid or expired cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, including resources belonging to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version, notification generation/revision, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Asset exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Adapter not implemented in this scaffold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary upstream failure; retry with the same idempotency
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/assets/{id}/complete:
    post:
      tags:
      - assets
      summary: Complete Asset Upload
      description: Owner-only verification of the exact reserved object's existence,
        actual bytes, signature/media type, size and SHA-256; reject mismatch. Mark
        ready only after server verification. Idempotent completion before content
        ingestion. Unclaimed uploads expire and are garbage-collected by a planned
        service job. Attach each ready asset once to owned content in its ingestion
        transaction.
      operationId: completeAssetUpload
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable client-generated key per logical operation; retain across
            retries.
          title: Idempotency-Key
        description: Stable client-generated key per logical operation; retain across
          retries.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
