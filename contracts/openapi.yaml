  /v1/contents/{id}/notification/restore:
    post:
      tags:
      - notifications
      summary: Restore Notification
      description: Explicit user restoration only. Compare generation AND revision.
        Dismissed -> active increments both generation and revision; active with matching
        versions is already_active no-op. Replay same idempotency key returns original
        response. This is the only transition that restores dismissed visibility.
      operationId: restoreNotification
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      - name: Idempotency-Key
