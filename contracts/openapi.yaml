openapi: 3.1.0
info:
  title: ITDA API
  description: Phase 0 reviewed API contract. Bearer authentication required on all
    /v1 routes. UTC ISO 8601 timestamps, UUID identifiers, snake_case JSON. Structured
    errors never include source text or credentials. Production data adapters remain
    unimplemented; local fixture mode is volatile and must not be deployed.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - operations
      summary: Health
      description: Process health only; not database, worker or deployment readiness.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/contents:
    post:
      tags:
      - contents
      summary: Durably receive content and schedule analysis
      description: 'Production contract: atomically persist source references, owned
        ready assets, one job, initial notification state and sync event before 201.
        Never await AI. Same user + operation + Idempotency-Key and payload returns
        the original 201; changed payload returns 409. Fixture mode simulates this
        in volatile memory and is NOT a durable receipt.'
      operationId: createContent
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable client-generated key per logical operation; retain across
            retries.
          title: Idempotency-Key
        description: Stable client-generated key per logical operation; retain across
          retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          description: Invalid or expired cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, including resources belonging to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version, notification generation/revision, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Asset exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Adapter not implemented in this scaffold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary upstream failure; retry with the same idempotency
            key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - contents
      summary: List Contents
      description: Owner-only keyset pagination, newest created_at then id descending.
        New inserts before the cursor are obtained through sync or a fresh list. Dismissed
        and archived items remain in the library.
      operationId: listContents
      security:
      - BearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          description: Opaque account-bound cursor; never construct or modify.
          title: Cursor
        description: Opaque account-bound cursor; never construct or modify.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum items; default 20.
          default: 20
          title: Limit
        description: Maximum items; default 20.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
