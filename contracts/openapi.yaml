  /v1/notification-events:
    post:
      tags:
      - notifications
      summary: Notification Event
      description: Only dismissal is supported. A smaller generation is acknowledged
        as stale_generation without applying it. Matching generation with wrong revision
        or future generation returns 409. Matching already-dismissed state is a no-op.
        Never changes workflow. Retry offline events with the original Idempotency-Key.
      operationId: recordNotificationEvent
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable client-generated key per logical operation; retain across
