  /v1/sync:
    get:
      tags:
      - sync
      summary: Sync Changes
      description: Owner-scoped commit-ordered changes. No cursor starts from retained
        beginning. Consume pages until has_more=false, persist next_cursor only after
        applying events; refresh GET /contents/{content_id} for content/recommendation/notification
        events and GET /preferences for preference events. content_id is null only
        for preferences. Delete events are tombstones; remove the matching local entity.
        Repeated cursors replay events; deduplicate by sequence. Invalid/expired cursor
        ->400 invalid_cursor and full bootstrap. Sequence is decimal string to avoid
        JavaScript precision loss. Production cursor retention/expiry is unresolved;
        fixture cursors expire on process restart.
      operationId: syncChanges
      security:
      - BearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          description: Opaque account-bound cursor; never construct or modify.
          title: Cursor
        description: Opaque account-bound cursor; never construct or modify.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum items; default 20.
          default: 20
          title: Limit
        description: Maximum items; default 20.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPage'
        '400':
          description: Invalid or expired cursor
