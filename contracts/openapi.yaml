      description: 'Owner-only short-lived (at most 60 seconds) signed GET for a verified
        ready asset. Objects and bucket remain private. Bearer capability URL must
        never be stored in source_url, sync events, analytics, or logs. Set Cache-Control:
        no-store. Phase 0 returns 501.'
