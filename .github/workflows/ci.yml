name: Phase 0 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-zero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run python -m app.contract_tools --check
      - run: uv run python ../../supabase/verify_contract.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/sync_fixtures.dart --check
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: '2.118.0'
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --level error
      - if: always()
        run: supabase stop --no-backup
